<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hades — Helpdesk Knowledge Base</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%231a365d'/%3E%3Cg transform='translate(100,100)'%3E%3Cpath d='M -6 -55 L -6 35 M 6 -55 L 6 35' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -6 35 Q 0 50 6 35' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -34 -55 Q -34 -28 -6 -18' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M 34 -55 Q 34 -28 6 -18' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -40 -62 L -28 -48 L -40 -34' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M 0 -68 L -10 -52 L 0 -36 L 10 -52 Z' fill='%23ffffff'/%3E%3Cpath d='M 40 -62 L 28 -48 L 40 -34' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="loading-bar" id="loadingBar"></div>
  <div class="toast" id="toast"></div>

  <!-- AUTH CHECK OVERLAY (shown while restoring session on reload) -->
  <div id="authLoading" class="login-wrap" style="flex-direction:column;gap:14px">
    <div style="width:34px;height:34px;border:3px solid #cbd5e0;border-top-color:#1a365d;border-radius:50%;animation:spin .7s linear infinite"></div>
    <div style="color:#4a5568;font-size:14px;font-weight:600">Memuat sesi…</div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <!-- LOGIN (shown by auth.js when there is no active session) -->
  <div class="login-wrap" id="loginPage" style="display:none">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:22px">
        <div style="display:inline-flex;align-items:center;gap:8px;background:#1a365d;color:#fff;padding:8px 18px;border-radius:8px;font-weight:700;font-size:15px">🔱 Hades</div>
      </div>
      <div style="font-size:19px;font-weight:700;text-align:center;margin-bottom:4px">Helpdesk Knowledge Base</div>
      <div id="loginError" class="login-error"></div>
      <div id="loginInfo" class="login-info"></div>

      <div id="loginForm">
        <div class="form-group"><label class="form-label">Email</label><input id="loginUser" class="form-input" type="email" placeholder="admin@peruri.id" autocomplete="username"/></div>
        <div class="form-group"><label class="form-label">Password</label><input id="loginPass" class="form-input" type="password" placeholder="password" autocomplete="current-password"/></div>
        <button class="btn btn-primary" style="width:100%;padding:10px" id="loginBtn" onclick="doLogin()">Masuk</button>
        <div style="text-align:center;margin-top:14px"><button type="button" class="link-btn" onclick="showForgot()">Lupa password?</button></div>
      </div>

      <div id="forgotForm" style="display:none">
        <div style="font-size:13px;color:#4a5568;margin-bottom:12px">Masukkan email akun Anda. Kami akan mengirim link untuk membuat password baru.</div>
        <div class="form-group"><label class="form-label">Email</label><input id="forgotEmail" class="form-input" type="email" placeholder="nama@peruri.id" autocomplete="username"/></div>
        <button class="btn btn-primary" style="width:100%;padding:10px" id="forgotBtn" onclick="doReset()">Kirim Link Reset</button>
        <div style="text-align:center;margin-top:14px"><button type="button" class="link-btn" onclick="hideForgot()">← Kembali ke login</button></div>
      </div>

      <div style="font-size:11px;color:#a0aec0;text-align:center;margin-top:18px">Akun dibuat oleh admin. Belum punya akun? Hubungi admin.</div>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" style="display:none">
    <!-- Topbar will be injected here -->
    <div id="topbarContainer"></div>
    
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="layout">
      <!-- The sidebar must be INSIDE .layout (flex row: sidebar | main), otherwise it stacks above the content -->
      <div class="sidebar" id="sidebar">
        <!-- Sidebar content will be injected here -->
        <div id="sidebarContent"></div>
      </div>
      <main class="main" id="mainContent">
        <!-- Page content will be loaded here -->
      </main>
    </div>
  </div>

  <!-- Modals will be injected here -->
  <div id="modalsContainer"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
