<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Hades KB</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%231a365d'/%3E%3Cg transform='translate(100,100)'%3E%3Cpath d='M -6 -55 L -6 35 M 6 -55 L 6 35' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -6 35 Q 0 50 6 35' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -34 -55 Q -34 -28 -6 -18' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M 34 -55 Q 34 -28 6 -18' fill='none' stroke='%23ffffff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M -40 -62 L -28 -48 L -40 -34' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M 0 -68 L -10 -52 L 0 -36 L 10 -52 Z' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="login-wrap" id="loginPage">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:22px">
        <div style="display:inline-flex;align-items:center;gap:8px;background:#1a365d;color:#fff;padding:8px 18px;border-radius:8px;font-weight:700;font-size:15px">🔱 Hades</div>
      </div>
      <div style="font-size:19px;font-weight:700;text-align:center;margin-bottom:4px">Helpdesk Knowledge Base</div>
      <div id="loginError" class="login-error"></div>
      <div class="form-group"><label class="form-label">Email</label><input id="loginUser" class="form-input" type="email" placeholder="admin@peruri.id"/></div>
      <div class="form-group"><label class="form-label">Password</label><input id="loginPass" class="form-input" type="password" placeholder="password"/></div>
      <button class="btn btn-primary" style="width:100%;padding:10px" id="loginBtn" onclick="doLogin()">Masuk</button>
    </div>
  </div>

  <script type="module">
    import { doLogin } from '/utils/auth.js';
    import { initAuth } from '/utils/auth.js';
    
    // Initialize auth
    initAuth();
    
    // Expose globally
    window.doLogin = doLogin;
    
    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        doLogin();
      }
    });
  </script>
</body>
</html>
